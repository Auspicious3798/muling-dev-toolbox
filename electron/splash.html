<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>沐柠环境盒</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        html, body {
            width: 100%;
            height: 100%;
            background: transparent;
            overflow: hidden;
            font-family: "Inter", "HarmonyOS Sans SC", "Microsoft YaHei", system-ui, sans-serif;
            -webkit-app-region: drag;
            user-select: none;
        }

        .splash {
            position: relative;
            width: 100%;
            height: 100%;
            display: grid;
            place-items: center;
        }

        .glow {
            position: absolute;
            width: 320px;
            height: 320px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(20, 184, 166, 0.36) 0%, rgba(20, 184, 166, 0.12) 42%, rgba(20, 184, 166, 0) 70%);
            filter: blur(6px);
            animation: breathe 3.6s ease-in-out infinite;
        }

        .card {
            position: relative;
            width: 366px;
            padding: 26px 26px 22px;
            border-radius: 22px;
            background: linear-gradient(160deg, rgba(30, 41, 59, 0.86) 0%, rgba(11, 17, 32, 0.9) 62%, rgba(11, 17, 32, 0.94) 100%);
            border: 1px solid rgba(255, 255, 255, 0.14);
            box-shadow:
                0 26px 56px rgba(2, 6, 23, 0.62),
                inset 0 1px 0 rgba(255, 255, 255, 0.16);
            overflow: hidden;
        }

        .card::before {
            content: "";
            position: absolute;
            inset: 0;
            background: radial-gradient(120% 90% at 50% -20%, rgba(94, 234, 212, 0.16), transparent 62%);
            pointer-events: none;
        }

        .lemon-wrap {
            position: relative;
            width: 84px;
            height: 84px;
            margin: 0 auto 14px;
            display: grid;
            place-items: center;
        }

        .lemon-wrap::after {
            content: "";
            position: absolute;
            inset: -8px;
            border-radius: 26px;
            background: radial-gradient(circle, rgba(251, 191, 36, 0.34), transparent 68%);
            animation: pulse 2.6s ease-in-out infinite;
        }

        .lemon-wrap img {
            position: relative;
            width: 96px;
            height: 96px;
            display: block;
            border-radius: 24px;
            object-fit: cover;
            animation: float 3.2s ease-in-out infinite;
            filter: drop-shadow(0 12px 24px rgba(2, 6, 23, 0.5));
        }

        .brand {
            text-align: center;
            font-size: 1.02rem;
            font-weight: 700;
            letter-spacing: 0.4px;
            color: #f8fafc;
        }

        .brand span {
            color: #5eead4;
        }

        .hint {
            margin-top: 6px;
            text-align: center;
            font-size: 0.78rem;
            color: rgba(203, 213, 225, 0.82);
            min-height: 18px;
            transition: opacity 220ms ease;
        }

        .hint.fade {
            opacity: 0;
        }

        .track {
            position: relative;
            margin-top: 18px;
            height: 2px;
            border-radius: 999px;
            background: rgba(148, 163, 184, 0.18);
            overflow: hidden;
        }

        .track::after {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 42%;
            height: 100%;
            border-radius: 999px;
            background: linear-gradient(90deg, rgba(20, 184, 166, 0) 0%, #2dd4bf 42%, #5eead4 62%, rgba(20, 184, 166, 0) 100%);
            animation: slide 1.7s cubic-bezier(0.65, 0, 0.35, 1) infinite;
        }

        .foot {
            margin-top: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            font-size: 0.68rem;
            letter-spacing: 0.6px;
            color: rgba(148, 163, 184, 0.72);
        }

        .dot {
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background: rgba(94, 234, 212, 0.9);
            animation: blink 1.4s ease-in-out infinite;
        }

        .dot:nth-child(2) { animation-delay: 0.2s; }
        .dot:nth-child(3) { animation-delay: 0.4s; }

        @keyframes slide {
            0% { transform: translateX(-120%); }
            100% { transform: translateX(260%); }
        }

        @keyframes breathe {
            0%, 100% { transform: scale(0.92); opacity: 0.72; }
            50% { transform: scale(1.06); opacity: 1; }
        }

        @keyframes pulse {
            0%, 100% { transform: scale(0.94); opacity: 0.55; }
            50% { transform: scale(1.1); opacity: 0.9; }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(-2deg); }
            50% { transform: translateY(-5px) rotate(2deg); }
        }

        @keyframes blink {
            0%, 100% { opacity: 0.25; }
            50% { opacity: 1; }
        }

        @media (prefers-reduced-motion: reduce) {
            .glow, .lemon-wrap::after, .lemon-wrap svg, .track::after, .dot {
                animation: none;
            }
        }
    </style>
</head>
<body>
<div class="splash">
    <div class="glow"></div>
    <div class="card">
        <div class="lemon-wrap">
            <img src="assets/xiaoning-portrait.png" alt="小柠"/>
        </div>
        <div class="brand">沐柠<span>环境盒</span></div>
        <div class="hint" id="hint">正在为您准备沙箱环境…</div>
        <div class="track"></div>
        <div class="foot">
            <span class="dot"></span>
            <span class="dot"></span>
            <span class="dot"></span>
            <span style="margin-left:4px">小柠正在布置工作台</span>
        </div>
    </div>
</div>
<script>
    (function () {
        const texts = [
            '正在为您准备沙箱环境…',
            '马上就好啦…',
            '正在点亮小柠…',
            '检查一下工具箱里的小家伙们…'
        ];
        const hint = document.getElementById('hint');
        let index = 0;

        setInterval(() => {
            if (!hint) return;
            hint.classList.add('fade');
            setTimeout(() => {
                index = (index + 1) % texts.length;
                hint.textContent = texts[index];
                hint.classList.remove('fade');
            }, 220);
        }, 1300);

        window.addEventListener('keydown', (event) => {
            if (event.key === 'Escape') event.preventDefault();
        });
    })();
</script>
</body>
</html>
